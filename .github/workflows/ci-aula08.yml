name: CI Pipeline - Aula 08

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ─────────────────────────────────────────────
# B4: Concurrency Control
# Cancela runs anteriores em progresso no mesmo
# branch/PR quando um novo push é feito.
# ─────────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint (ESLint) — B2: Cache explícito
  # ─────────────────────────────────────────────
  lint:
    name: 🔍 Lint - Análise Estática (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-08

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aula-08/package-lock.json

      - name: Cache node_modules (B2)
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: aula-08/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('aula-08/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Instalar dependências (skip se cache hit)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Reportar status do cache
        run: |
          if [ "${{ steps.cache-deps.outputs.cache-hit }}" == "true" ]; then
            echo "✅ Cache HIT — node_modules restaurado do cache!"
          else
            echo "⚠️  Cache MISS — dependências instaladas e cache salvo para próxima execução"
          fi

      - name: Executar ESLint
        run: npm run lint

  # ─────────────────────────────────────────────
  # Job 2: Test (Jest com coverage) — B1: Matrix
  # ─────────────────────────────────────────────
  test:
    name: 🧪 Test - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: aula-08

    strategy:
      matrix:
        node-version: ['18', '20']
      fail-fast: false

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: aula-08/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm run test:ci

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: aula-08/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3: Build (Docker)
  # ─────────────────────────────────────────────
  build:
    name: 🐳 Build - Docker Image
    runs-on: ubuntu-latest
    needs: test

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      APP_ENV: ${{ secrets.APP_ENV }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verificar secrets configurados
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "⚠️  AWS_REGION não configurado"
          else
            echo "✅ AWS_REGION configurado (valor mascarado pelo GitHub)"
          fi
          if [ -z "$APP_ENV" ]; then
            echo "⚠️  APP_ENV não configurado"
          else
            echo "✅ APP_ENV configurado (valor mascarado pelo GitHub)"
          fi

      - name: Build da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: aula-08
          push: false
          load: true
          tags: |
            app:latest
            app:${{ github.sha }}
          build-args: |
            AWS_REGION=${{ secrets.AWS_REGION }}
            APP_ENV=${{ secrets.APP_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── B5: Smoke Test ──────────────────────
      - name: Iniciar container para smoke test
        run: |
          docker run -d \
            --name smoke-test \
            -p 3000:3000 \
            app:latest

      - name: Aguardar container inicializar
        run: sleep 5

      - name: Executar health check
        run: |
          RESPONSE=$(curl -sf http://localhost:3000/health)
          echo "Resposta do health check: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"' && \
            echo "✅ Smoke test passou — container saudável!" || \
            (echo "❌ Smoke test falhou!" && exit 1)

      - name: Parar e remover container
        if: always()
        run: |
          docker stop smoke-test
          docker rm smoke-test
          echo "🧹 Container parado e removido com sucesso"
      # ── fim B5 ──────────────────────────────

      - name: Exibir resumo do build
        run: |
          echo "### 🐳 Docker Build concluído com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagem:** app:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag SHA:** app:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region:** ${{ secrets.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App Env:** ${{ secrets.APP_ENV }}" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # Job 4: PR Comment — B3
  # ─────────────────────────────────────────────
  comment-pr:
    name: 💬 Comment - Resultado do CI no PR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    permissions:
      pull-requests: write

    steps:
      - name: Comentar resultado do CI no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.sha.substring(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## ✅ CI Pipeline — Todos os checks passaram!',
              '',
              '| Job | Status |',
              '|-----|--------|',
              '| 🔍 Lint (ESLint) | ✅ Passou |',
              '| 🧪 Test Node 18 | ✅ Passou |',
              '| 🧪 Test Node 20 | ✅ Passou |',
              '| 🐳 Docker Build | ✅ Passou |',
              '',
              `**Commit:** \`${sha}\``,
              `**Branch:** \`${context.payload.pull_request.head.ref}\``,
              `**Execução completa:** [Ver logs](${runUrl})`,
              '',
              '> Pipeline executado automaticamente pelo GitHub Actions.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
