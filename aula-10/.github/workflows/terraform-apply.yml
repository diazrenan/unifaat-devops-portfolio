name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - "aula-10/terraform/**/*.tf"
      - "aula-10/terraform/**/*.tfvars"

permissions:
  contents: read

jobs:
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aula-10/terraform

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Credenciais AWS Academy (session token)
      # ---------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      # ---------------------------------------------------------------
      # 3. Setup Terraform
      # ---------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # ---------------------------------------------------------------
      # 4. Init
      # ---------------------------------------------------------------
      - name: Terraform Init
        run: terraform init -input=false

      # ---------------------------------------------------------------
      # 5. Apply
      # ---------------------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve

      # ---------------------------------------------------------------
      # 6. Mostra outputs (IP da EC2, URL da app)
      # ---------------------------------------------------------------
      - name: Terraform Outputs
        run: terraform output

      # ---------------------------------------------------------------
      # 7. Resumo no GitHub Actions
      # ---------------------------------------------------------------
      - name: Apply summary
        if: success()
        run: |
          echo "## ✅ Terraform Apply concluído" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor  | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
