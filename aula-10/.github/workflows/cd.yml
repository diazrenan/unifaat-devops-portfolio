name: "CD Pipeline"

on:
  push:
    branches:
      - main

env:
  AWS_REGION:    us-east-1
  ECR_REPO_NAME: technova-api        # nome do repositório no ECR
  APP_PORT:      3000
  HEALTH_PATH:   /health

jobs:
  # ===========================================================================
  # JOB 1 — lint
  # ===========================================================================
  lint:
    name: "Lint (ESLint)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technova-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: technova-api/package.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  # ===========================================================================
  # JOB 2 — test
  # ===========================================================================
  test:
    name: "Test (Jest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technova-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: technova-api/package.json

      - name: Install dependencies
        run: npm install

      - name: Run Jest tests
        run: npm test

  # ===========================================================================
  # JOB 3 — build-push (depende de lint + test)
  # ===========================================================================
  build-push:
    name: "Build & Push ECR"
    runs-on: ubuntu-latest
    needs: [lint, test]

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
      image_tag: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Gera as tags da imagem: SHA curto + latest
      # -----------------------------------------------------------------------
      - name: Image metadata
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Autentica na AWS com credenciais de sessão do Lab
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Login no ECR
      # -----------------------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------------
      # Garante que o repositório ECR existe (idempotente)
      # -----------------------------------------------------------------------
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" \
            --region "$AWS_REGION" 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "$ECR_REPO_NAME" \
            --region "$AWS_REGION" \
            --image-scanning-configuration scanOnPush=true \
            --tags Key=Project,Value=technova Key=ManagedBy,Value=github-actions

      # -----------------------------------------------------------------------
      # Build multi-stage + push com SHA e latest
      # -----------------------------------------------------------------------
      - name: Build, tag and push Docker image
        id: build
        env:
          REGISTRY:  ${{ steps.login-ecr.outputs.registry }}
          SHA_SHORT: ${{ steps.meta.outputs.sha_short }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPO_NAME}"

          docker build \
            --file Dockerfile \
            --build-arg APP_VERSION="${SHA_SHORT}" \
            --tag "${IMAGE_URI}:${SHA_SHORT}" \
            --tag "${IMAGE_URI}:latest" \
            --cache-from "${IMAGE_URI}:latest" \
            .

          docker push "${IMAGE_URI}:${SHA_SHORT}"
          docker push "${IMAGE_URI}:latest"

          echo "image_uri=${IMAGE_URI}:${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "✅ Imagem publicada: ${IMAGE_URI}:${SHA_SHORT}"

  # ===========================================================================
  # JOB 4 — deploy (depende de build-push)
  # ===========================================================================
  deploy:
    name: "Deploy EC2 (Recreate)"
    runs-on: ubuntu-latest
    needs: [build-push]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Precisa das credenciais para gerar o token ECR dentro da EC2
      # Passamos como variáveis de ambiente para o script SSH
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Obtém o endpoint do ECR registry para passar ao script remoto
      # -----------------------------------------------------------------------
      - name: Get ECR registry endpoint
        id: ecr
        run: |
          REGISTRY=$(aws ecr get-authorization-token \
            --region "$AWS_REGION" \
            --query 'authorizationData[0].proxyEndpoint' \
            --output text | sed 's|https://||')
          echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # SSH na EC2 — estratégia Recreate + health check
      # Secrets adicionais necessários:
      #   EC2_HOST       — IP público ou DNS da instância
      #   EC2_SSH_KEY    — chave privada PEM (conteúdo completo)
      #   EC2_SSH_USER   — usuário SSH (ex: ec2-user)
      # -----------------------------------------------------------------------
      - name: Deploy via SSH (Recreate strategy)
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_URI:         ${{ needs.build-push.outputs.image_uri }}
          ECR_REGISTRY:      ${{ steps.ecr.outputs.registry }}
          AWS_REGION:        ${{ env.AWS_REGION }}
          APP_PORT:          ${{ env.APP_PORT }}
          APP_VERSION:       ${{ needs.build-push.outputs.image_tag }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_SSH_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          port:        22
          envs:        IMAGE_URI,ECR_REGISTRY,AWS_REGION,APP_PORT,APP_VERSION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            set -e

            echo "=== [1/5] Autenticando no ECR ==="
            aws configure set aws_access_key_id     "$AWS_ACCESS_KEY_ID"
            aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
            aws configure set aws_session_token     "$AWS_SESSION_TOKEN"
            aws configure set region                "$AWS_REGION"

            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            echo "=== [2/5] Parando container anterior (se existir) ==="
            docker stop technova-app 2>/dev/null || true

            echo "=== [3/5] Removendo container anterior ==="
            docker rm   technova-app 2>/dev/null || true

            echo "=== [4/5] Pull da nova imagem: ${IMAGE_URI} ==="
            docker pull "${IMAGE_URI}"

            echo "=== [5/5] Iniciando novo container ==="
            docker run -d \
              --name technova-app \
              --restart unless-stopped \
              -p "${APP_PORT}:${APP_PORT}" \
              -e NODE_ENV=production \
              -e PORT="${APP_PORT}" \
              -e APP_VERSION="${APP_VERSION}" \
              "${IMAGE_URI}"

            echo "=== Container iniciado. Aguardando warm-up (15s) ==="
            sleep 15

            echo "=== Health check: http://localhost:${APP_PORT}/health ==="
            HTTP_STATUS=$(curl -s -o /tmp/health_response.json \
              -w "%{http_code}" \
              "http://localhost:${APP_PORT}/health")

            echo "Resposta do health check:"
            cat /tmp/health_response.json
            echo ""

            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ Health check FALHOU — HTTP ${HTTP_STATUS}"
              echo "=== Logs do container ==="
              docker logs --tail 50 technova-app
              exit 1
            fi

            echo "✅ Health check PASSOU — HTTP ${HTTP_STATUS}"
            echo "=== Deploy concluído: ${IMAGE_URI} ==="

      # -----------------------------------------------------------------------
      # Resumo no log do GitHub Actions
      # -----------------------------------------------------------------------
      - name: Deploy summary
        if: success()
        run: |
          echo "## ✅ Deploy realizado com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | \`${{ needs.build-push.outputs.image_uri }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Estratégia | Recreate |" >> $GITHUB_STEP_SUMMARY

      - name: Deploy failure summary
        if: failure()
        run: |
          echo "## ❌ Deploy FALHOU" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verifique os logs do job **Deploy EC2** para detalhes." >> $GITHUB_STEP_SUMMARY
          echo "Imagem tentada: \`${{ needs.build-push.outputs.image_uri }}\`" >> $GITHUB_STEP_SUMMARY
