name: AI Review

# ─── Trigger ──────────────────────────────────────────────────────────────────
on:
  pull_request:
    types: [opened, synchronize, reopened]

# ─── Permissões mínimas necessárias ──────────────────────────────────────────
permissions:
  contents: read        # ler o código
  pull-requests: write  # postar comentário no PR

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo para o diff

      # ── 2. Setup Node.js ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Coleta o diff do PR ───────────────────────────────────────────────
      # Compara o HEAD do PR com a base (ex: main) e salva o diff em pr.diff
      - name: Coletar diff do PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Base SHA : $BASE_SHA"
          echo "Head SHA : $HEAD_SHA"

          git diff "$BASE_SHA" "$HEAD_SHA" \
            -- '*.ts' '*.js' '*.tsx' '*.jsx' '*.mjs' '*.cjs' \
            > pr.diff

          LINES=$(wc -l < pr.diff)
          echo "Linhas no diff: $LINES"

          if [ "$LINES" -eq 0 ]; then
            echo "Diff vazio — nenhum arquivo JS/TS alterado."
          fi

      # ── 4. Executa o AI Review ───────────────────────────────────────────────
      - name: Executar análise de código
        id: ai_review
        # Continua mesmo se o script retornar exit 1 (CRITICAL)
        # para que o próximo step possa postar o comentário antes de falhar
        continue-on-error: true
        run: |
          node .github/scripts/ai-review.js pr.diff

          # Salva o exit code para usar no quality gate
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ── 5. Lê o resultado JSON ───────────────────────────────────────────────
      - name: Ler resultado da análise
        id: result
        run: |
          if [ -f ai-review-result.json ]; then
            CRITICAL=$(jq '.summary.critical' ai-review-result.json)
            WARNING=$(jq  '.summary.warning'  ai-review-result.json)
            INFO=$(jq     '.summary.info'     ai-review-result.json)
            TOTAL=$(jq    '.summary.total'    ai-review-result.json)
          else
            CRITICAL=0; WARNING=0; INFO=0; TOTAL=0
          fi

          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "warning=$WARNING"   >> "$GITHUB_OUTPUT"
          echo "info=$INFO"         >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL"       >> "$GITHUB_OUTPUT"

          echo "=== Resumo ==="
          echo "  CRITICAL : $CRITICAL"
          echo "  WARNING  : $WARNING"
          echo "  INFO     : $INFO"
          echo "  TOTAL    : $TOTAL"

      # ── 6. Posta comentário no PR ─────────────────────────────────────────────
      - name: Postar comentário no PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs      = require('fs');
            const issue   = context.issue;

            // Lê o comentário formatado gerado pelo script
            let body = '';
            if (fs.existsSync('ai-review-comment.md')) {
              body = fs.readFileSync('ai-review-comment.md', 'utf8');
            } else {
              body = '## 🤖 AI Review\n\nNão foi possível gerar o relatório de análise.';
            }

            // Busca comentários anteriores do bot para atualizar em vez de duplicar
            const comments = await github.rest.issues.listComments({
              owner      : issue.owner,
              repo       : issue.repo,
              issue_number: issue.number,
            });

            const BOT_MARKER = '## 🤖 AI Review';
            const existing   = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes(BOT_MARKER)
            );

            if (existing) {
              // Atualiza o comentário existente
              await github.rest.issues.updateComment({
                owner     : issue.owner,
                repo      : issue.repo,
                comment_id: existing.id,
                body,
              });
              console.log('Comentário atualizado:', existing.id);
            } else {
              // Cria novo comentário
              const created = await github.rest.issues.createComment({
                owner       : issue.owner,
                repo        : issue.repo,
                issue_number: issue.number,
                body,
              });
              console.log('Comentário criado:', created.data.id);
            }

      # ── 7. Quality Gate ──────────────────────────────────────────────────────
      # Falha o workflow (bloqueando o PR) apenas se houver findings CRITICAL
      - name: Quality Gate
        env:
          CRITICAL: ${{ steps.result.outputs.critical }}
        run: |
          echo "Findings CRITICAL: $CRITICAL"

          if [ "$CRITICAL" -gt 0 ]; then
            echo ""
            echo "❌ QUALITY GATE FAILED"
            echo "   $CRITICAL finding(s) CRITICAL detectado(s)."
            echo "   Corrija os problemas apontados no comentário do PR antes de solicitar review humano."
            exit 1
          fi

          echo ""
          echo "✅ QUALITY GATE PASSED"
          echo "   Nenhum finding CRITICAL. O PR pode ser mergeado (após review humano)."
