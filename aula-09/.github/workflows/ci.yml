name: CI — Build, Test e Push para ECR

# ─── Triggers ──────────────────────────────────────────────────────────────────
# Push em main/master dispara o pipeline completo (lint + test + build + push ECR)
# Push em outras branches e PRs disparam apenas lint + test (sem push)
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'        # semver tags também disparam push com tags semver
  pull_request:
    branches:
      - main
      - master

# ─── Variáveis globais ────────────────────────────────────────────────────────
env:
  AWS_REGION   : us-east-1
  ECR_REPO     : technova-api
  NODE_VERSION : '20'

# ─── Permissões mínimas ────────────────────────────────────────────────────────
permissions:
  contents: read
  id-token: write   # necessário para OIDC (futuro — por ora usa secrets)

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: Lint e Testes
  # Roda em todo push e PR — falha rápido antes de tentar o build Docker
  # ════════════════════════════════════════════════════════════════════════════
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: Build e Push para Amazon ECR
  # Só roda em push para main/master ou em git tags semver
  # Depende do job quality ter passado
  # ════════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push ECR
    runs-on: ubuntu-latest
    needs: quality

    # Só executa em push para main/master ou em tags semver — não em PRs
    if: |
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main'   ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para git describe (semver)

      # ── Configura credenciais AWS do Learner Lab ─────────────────────────────
      # As 3 credenciais temporárias são salvas como secrets no repositório:
      #   Settings → Secrets → Actions:
      #     AWS_ACCESS_KEY_ID
      #     AWS_SECRET_ACCESS_KEY
      #     AWS_SESSION_TOKEN
      #
      # ⚠️ As credenciais do Learner Lab expiram a cada sessão (~4h).
      #    Atualize os secrets no repositório a cada nova sessão do Lab.
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id     : ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key : ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token     : ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region            : ${{ env.AWS_REGION }}

      # ── Login no ECR ─────────────────────────────────────────────────────────
      - name: Login no Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2
        # outputs: registry → ex: 123456789012.dkr.ecr.us-east-1.amazonaws.com

      # ── Garante que o repositório ECR existe (idempotente) ───────────────────
      - name: Criar repositório ECR (se não existir)
        env:
          REPO: ${{ env.ECR_REPO }}
        run: |
          if aws ecr describe-repositories --repository-names "$REPO" --region "$AWS_REGION" &>/dev/null; then
            echo "Repositório '$REPO' já existe."
          else
            echo "Criando repositório '$REPO'..."
            aws ecr create-repository \
              --repository-name "$REPO" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --image-tag-mutability MUTABLE
            echo "Repositório criado."
          fi

      # ── Determina as tags da imagem ──────────────────────────────────────────
      - name: Calcular tags da imagem
        id: tags
        env:
          REGISTRY : ${{ steps.ecr_login.outputs.registry }}
          REPO     : ${{ env.ECR_REPO }}
          REF      : ${{ github.ref }}
          SHA      : ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA::7}"
          TAG_SHA="sha-${SHORT_SHA}"
          BASE="${REGISTRY}/${REPO}"

          # Sempre inclui sha e latest
          TAGS="${BASE}:${TAG_SHA},${BASE}:latest"

          # Tags semver somente se for uma git tag v*.*.*
          if [[ "$REF" =~ ^refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            TAGS="${TAGS},${BASE}:${PATCH},${BASE}:${MINOR},${BASE}:${MAJOR}"
            echo "Semver detectado: ${PATCH} | ${MINOR} | ${MAJOR}"
          fi

          echo "tags=${TAGS}"       >> "$GITHUB_OUTPUT"
          echo "sha_tag=${TAG_SHA}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}"       >> "$GITHUB_OUTPUT"

          echo "=== Tags que serão enviadas ==="
          echo "$TAGS" | tr ',' '\n'

      # ── Build e Push com Docker Buildx ───────────────────────────────────────
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push da imagem
        uses: docker/build-push-action@v5
        with:
          context  : .
          push     : true
          tags     : ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to  : type=gha,mode=max
          labels    : |
            git.sha=${{ github.sha }}
            git.ref=${{ github.ref }}
            build.run=${{ github.run_id }}
            build.repo=${{ env.ECR_REPO }}

      # ── Resumo final ─────────────────────────────────────────────────────────
      - name: Resumo do job
        env:
          TAGS : ${{ steps.tags.outputs.tags }}
          BASE : ${{ steps.tags.outputs.base }}
        run: |
          echo "## ✅ Push para ECR concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Repositório:** \`${BASE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags enviadas:**" >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS" | tr ',' '\n' | while read TAG; do
            echo "- \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
